
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHISEE ATELIER EDUCN0TES</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 25px 15px;
    font-family: Arial, sans-serif;
    background: #fff0f5;
    color: #593747;
}

.container {
    max-width: 1250px;
    margin: auto;
    padding: 25px;
    background: #fffafd;
    border: 3px solid #e8a9c3;
    border-radius: 25px;
    box-shadow: 0 10px 35px rgba(190,112,147,.2);
}

.header {
    text-align: center;
    padding: 30px 15px;
    margin-bottom: 25px;
    background: linear-gradient(135deg,#f8c9dc,#e9a5c1);
    border: 2px solid #d98eae;
    border-radius: 20px;
}

.header h1 {
    font-family: Georgia,serif;
    font-size: 30px;
    letter-spacing: 2px;
    color: #713d56;
}

.header p {
    font-family: Georgia,serif;
    font-style: italic;
}

.summary {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

.summary-box {
    flex: 1;
    text-align: center;
    padding: 20px;
    background: #fff0f6;
    border: 2px solid #edc0d3;
    border-radius: 18px;
}

.summary-box h3 {
    font-size: 13px;
    color: #995c78;
}

.summary-box p {
    font-family: Georgia,serif;
    font-size: 35px;
    font-weight: bold;
    color: #b75f86;
    margin: 8px;
}

.sales {
    background: linear-gradient(135deg,#e9a5c1,#f4c5d9);
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

button {
    border: none;
    padding: 11px 17px;
    border-radius: 10px;
    background: #d989aa;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #bd668b;
}

/* COMPACT CUSTOMER SEARCH */
.search {
    flex: 0 1 260px;
    width: 260px;
    max-width: 100%;
    min-width: 180px;
}

input, select {
    padding: 11px;
    border: 1px solid #e8b5cb;
    border-radius: 9px;
    background: #fffafd;
    color: #593747;
    width: 100%;
}

.table-wrapper {
    overflow-x: auto;
    border-radius: 15px;
    border: 1px solid #e8b5cb;
}

table {
    width: 100%;
    min-width: 1050px;
    border-collapse: collapse;
}

th {
    background: #d989aa;
    color: white;
    padding: 14px 8px;
    font-size: 12px;
}

td {
    padding: 12px 8px;
    border-bottom: 1px solid #f0d5e1;
    text-align: center;
    font-size: 12px;
}

tbody tr:nth-child(even) {
    background: #fff0f6;
}

tbody tr:hover {
    background: #fce0eb;
}

.status, .access {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
}

.status {
    background: #e0f1df;
    color: #477347;
}

.pending {
    background: #fff0c9;
    color: #946d21;
}

.access {
    background: #d989aa;
    color: white;
}

.not-sent {
    background: #f5d5d5;
    color: #a34d4d;
}

.action-btn {
    padding: 7px 9px;
    margin: 2px;
    font-size: 11px;
}

.delete {
    background: #b95c70;
}

.footer {
    text-align: center;
    margin-top: 25px;
    font-family: Georgia,serif;
    font-style: italic;
    color: #bd7996;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(65,30,48,.55);
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.modal-content {
    background: #fffafd;
    padding: 25px;
    border: 2px solid #e8a9c3;
    border-radius: 20px;
    width: 100%;
    max-width: 450px;
    max-height: 90vh;
    overflow-y: auto;
}

.modal-content h2 {
    text-align: center;
    color: #b75f86;
}

.form-group {
    margin-bottom: 12px;
}

.form-group label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
    font-weight: bold;
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.form-buttons button {
    flex: 1;
}

.cancel {
    background: #aaa;
}

@media(max-width:700px) {
    .container { padding: 13px; }
    .summary { gap: 8px; }
    .summary-box { padding: 12px 5px; }
    .summary-box p { font-size: 25px; }
    .summary-box h3 { font-size: 10px; }
    .header h1 { font-size: 20px; }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>CHISEE ATELIER EDUCN0TES</h1>
        <p>♡ Reviewer Sales & Customer Management System ♡</p>
    </div>

    <div class="summary">
        <div class="summary-box">
            <h3>TOTAL ORDERS</h3>
            <p id="totalOrders">0</p>
            <h3>ALL CUSTOMER ORDERS</h3>
        </div>

        <div class="summary-box sales">
            <h3>TOTAL SALES</h3>
            <p id="totalSales">₱0</p>
        </div>
    </div>

    <div class="controls">
        <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="Search customer name..."
            oninput="renderTable()"
        >

        <button onclick="openModal()">＋ ADD ORDER</button>
        <button onclick="exportCSV()">↓ EXPORT CSV</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>NUMBER</th>
                    <th>NAME</th>
                    <th>DATE</th>
                    <th>PAYMENT</th>
                    <th>AMOUNT</th>
                    <th>METHOD</th>
                    <th>BUNDLE</th>
                    <th>EMAIL</th>
                    <th>ACCESS</th>
                    <th>ACTION</th>
                </tr>
            </thead>
            <tbody id="orderTable"></tbody>
        </table>
    </div>

    <div class="footer">
        ♡ Thank you for supporting Chisee Atelier! ♡
    </div>

</div>

<!-- ADD / EDIT MODAL -->

<div class="modal" id="orderModal">
    <div class="modal-content">

        <h2 id="modalTitle">♡ ADD NEW ORDER ♡</h2>

        <form id="orderForm">

            <div class="form-group">
                <label>Customer Name</label>
                <input id="name" required placeholder="Enter customer name">
            </div>

            <div class="form-group">
                <label>Date</label>
                <input id="date" type="date" required>
            </div>

            <div class="form-group">
                <label>Amount (₱)</label>
                <input id="amount" type="number" min="0" step="0.01" required>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select id="method">
                    <option>GCASH</option>
                    <option>MAYA</option>
                    <option>BANK TRANSFER</option>
                    <option>CASH</option>
                    <option>OTHER</option>
                </select>
            </div>

            <div class="form-group">
                <label>Bundle / Reviewer</label>
                <select id="bundle" required>
                    <option value="BUNDLE">BUNDLE</option>
                    <option value="REVIEWER">REVIEWER</option>
                </select>
            </div>

            <div class="form-group">
                <label>Customer Email</label>
                <input id="email" type="email" placeholder="customer@email.com">
            </div>

            <div class="form-group">
                <label>Proof of Payment</label>
                <select id="payment">
                    <option>VERIFIED</option>
                    <option>PENDING</option>
                </select>
            </div>

            <div class="form-group">
                <label>Access Status</label>
                <select id="access">
                    <option>SENT</option>
                    <option>NOT SENT</option>
                </select>
            </div>

            <div class="form-buttons">
                <button type="submit">SAVE ORDER</button>
                <button type="button" class="cancel"
                    onclick="closeModal()">CANCEL</button>
            </div>

        </form>
    </div>
</div>

<script>

// STORAGE SETTINGS
const STORAGE_KEY = "chiseeOrders";


const oldSampleNames = [
    "ROALY",
    "MJ (EJYNAH)",
    "JASMINE",
    "TOJI",
    "JULIE ANN",
    "USER",
    "JHA (MAJOY)",
    "MIN",
    "JAN PRIV"
];

// LOAD SAVED DATA
function loadData() {

    try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (saved === null) {
            return [];
        }

        const parsed = JSON.parse(saved);

        if (!Array.isArray(parsed)) {
            return [];
        }

        return parsed;

    } catch (error) {
        console.error("Loading error:", error);
        return [];
    }
}

let orders = loadData();
let editIndex = null;

// SAVE DATA
function saveData() {

    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(orders)
        );

        return true;

    } catch (error) {
        console.error("Saving error:", error);
        alert("Unable to save data. Please check browser storage.");
        return false;
    }
}

// FORMAT DATE
function formatDate(date) {

    if (!date) return "";

    const d = new Date(date + "T00:00:00");

    return d.toLocaleDateString("en-US", {
        year: "numeric",
        month: "long",
        day: "numeric"
    });
}

// UPDATE SUMMARY AND TABLE
function renderTable() {

    const table = document.getElementById("orderTable");

    const search = document.getElementById("searchInput")
        .value.toLowerCase().trim();

    table.innerHTML = "";

    const filtered = orders
        .map((order, index) => ({...order, index}))
        .filter(item =>
            String(item.name || "").toLowerCase().includes(search)
        );

    filtered.forEach(item => {

        const o = item;
        const row = document.createElement("tr");

        const values = [
            o.index + 1,
            o.name,
            formatDate(o.date),
            o.payment,
            "₱" + Number(o.amount || 0).toLocaleString("en-PH"),
            o.method,
            o.bundle,
            o.email,
            o.access
        ];

        values.forEach((value, i) => {

            const td = document.createElement("td");

            if (i === 3) {

                const span = document.createElement("span");

                span.className = o.payment === "VERIFIED"
                    ? "status"
                    : "status pending";

                span.textContent = o.payment;

                td.appendChild(span);

            } else if (i === 8) {

                const span = document.createElement("span");

                span.className = o.access === "SENT"
                    ? "access"
                    : "access not-sent";

                span.textContent = o.access;

                td.appendChild(span);

            } else {

                td.textContent = value;
            }

            row.appendChild(td);
        });

        const action = document.createElement("td");

        const editBtn = document.createElement("button");
        editBtn.textContent = "EDIT";
        editBtn.className = "action-btn";
        editBtn.onclick = () => editOrder(o.index);

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "DELETE";
        deleteBtn.className = "action-btn delete";
        deleteBtn.onclick = () => deleteOrder(o.index);

        action.append(editBtn, deleteBtn);
        row.appendChild(action);

        table.appendChild(row);
    });

    document.getElementById("totalOrders").textContent =
        orders.length;

    const sales = orders.reduce(
        (total, order) => total + Number(order.amount || 0),
        0
    );

    document.getElementById("totalSales").textContent =
        "₱" + sales.toLocaleString("en-PH", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });
}


function openModal() {

    editIndex = null;

    document.getElementById("orderForm").reset();

    document.getElementById("modalTitle").textContent =
        "♡ ADD NEW ORDER ♡";

    document.getElementById("date").value =
        new Date().toISOString().slice(0, 10);

    document.getElementById("orderModal").style.display = "flex";
}

function closeModal() {

    document.getElementById("orderModal").style.display = "none";
}

// ADD OR UPDATE ORDER
document.getElementById("orderForm").addEventListener(
    "submit",
    function(e) {

        e.preventDefault();

        const order = {
            name: document.getElementById("name").value.trim().toUpperCase(),
            date: document.getElementById("date").value,
            amount: Number(document.getElementById("amount").value),
            method: document.getElementById("method").value,
            bundle: document.getElementById("bundle").value,
            email: document.getElementById("email").value.trim(),
            payment: document.getElementById("payment").value,
            access: document.getElementById("access").value
        };

        const previousOrders = [...orders];

        if (editIndex !== null) {
            orders[editIndex] = order;
        } else {
            orders.push(order);
        }

        if (saveData()) {

            renderTable();
            closeModal();

            alert("♡ Order successfully saved!");

        } else {

            orders = previousOrders;
            renderTable();
        }
    }
);

// EDIT ORDER
function editOrder(index) {

    const o = orders[index];

    editIndex = index;

    document.getElementById("modalTitle").textContent =
        "♡ EDIT CUSTOMER ORDER ♡";

    document.getElementById("name").value = o.name;
    document.getElementById("date").value = o.date;
    document.getElementById("amount").value = o.amount;
    document.getElementById("method").value = o.method;
    document.getElementById("bundle").value = o.bundle;
    document.getElementById("email").value = o.email;
    document.getElementById("payment").value = o.payment;
    document.getElementById("access").value = o.access;

    document.getElementById("orderModal").style.display = "flex";
}

// DELETE ORDER
function deleteOrder(index) {

    if (!confirm("Are you sure you want to delete this order?")) {
        return;
    }

    const previousOrders = [...orders];

    orders.splice(index, 1);

    if (saveData()) {

        renderTable();

    } else {

        orders = previousOrders;
        renderTable();
    }
}

// EXPORT CSV
function exportCSV() {

    if (orders.length === 0) {
        alert("No customer records to export.");
        return;
    }

    const headers = [
        "NUMBER",
        "NAME",
        "DATE",
        "PAYMENT",
        "AMOUNT",
        "METHOD",
        "BUNDLE",
        "EMAIL",
        "ACCESS"
    ];

    const rows = orders.map((o, i) => [
        i + 1,
        o.name,
        o.date,
        o.payment,
        o.amount,
        o.method,
        o.bundle,
        o.email,
        o.access
    ]);

    function escapeCSV(value) {
        return '"' + String(value ?? "").replace(/"/g, '""') + '"';
    }

    const csv = [headers, ...rows]
        .map(row => row.map(escapeCSV).join(","))
        .join("\n");

    const blob = new Blob(["\uFEFF" + csv], {
        type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "Chisee_Atelier_Orders.csv";
    link.click();

    URL.revokeObjectURL(url);
}

renderTable();

</script>

</body>
</html>
